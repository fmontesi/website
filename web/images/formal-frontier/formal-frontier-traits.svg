<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1600" height="784" viewBox="0 0 1600 784" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">The Formal Frontier and Formal-First Research</title>
  <desc id="heroDesc">A hero graphic with four Lucide-style project icons: Needle, Foundation, Amplification, and Exploration.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .heading { fill:#23352f; font-family:Inter, 'Helvetica Neue', Arial, sans-serif; font-weight:700; letter-spacing:-2.5px; }
      .subtitle { fill:#51655c; font-family:Inter, 'Helvetica Neue', Arial, sans-serif; font-weight:400; }
      .eyebrow { fill:#527b70; font-family:Inter, 'Helvetica Neue', Arial, sans-serif; font-weight:700; letter-spacing:3.5px; }
      .panel { fill:#fffdfa; stroke:#dbe5dc; stroke-width:2; }
      .trait { fill:#23352f; font-family:Inter, 'Helvetica Neue', Arial, sans-serif; font-weight:700; }
      .tagline { fill:#54635d; font-family:Inter, 'Helvetica Neue', Arial, sans-serif; font-weight:400; }
      .lucide { fill:none; stroke:#7655a3; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    ]]></style>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#dee9e2"/></pattern>
  </defs>

  <g id="background" inkscape:groupmode="layer" inkscape:label="Background">
    <rect width="1600" height="784" fill="#f7f8f5"/>
    <rect x="0" y="0" width="1600" height="784" fill="url(#dots)" opacity="0.40"/>
    <rect x="0" y="0" width="12" height="784" fill="#4e9581"/>
  </g>

  <g id="heading" inkscape:groupmode="layer" inkscape:label="Title and subtitle">
    <text class="eyebrow" x="94" y="110" font-size="19">FORMAL-FIRST RESEARCH</text>
    <text class="heading" x="90" y="206" font-size="82">The Formal Frontier</text>
    <text class="subtitle" x="95" y="261" font-size="29">Four ways of relating to shared, machine-verified knowledge</text>
    <line x1="95" y1="306" x2="1505" y2="306" stroke="#81aa9a" stroke-width="3" stroke-dasharray="10 10"/>
  </g>

  <g id="cards" inkscape:groupmode="layer" inkscape:label="Project trait cards">
    <g id="card-needle">
      <rect class="panel" x="95" y="357" width="335" height="335" rx="20"/>
      <rect x="210" y="402" width="105" height="105" rx="28" fill="#eee7f5"/>
      <g id="icon-needle" class="lucide" transform="translate(226.5 418.5) scale(3)">
        <path d="M7 7h10v10"/>
        <path d="M7 17 17 7"/>
      </g>
      <text class="trait" x="262.5" y="596" font-size="35" text-anchor="middle">Needle</text>
      <text class="tagline" x="262.5" y="643" font-size="24" text-anchor="middle">Reach far</text>
    </g>

    <g id="card-foundation">
      <rect class="panel" x="453" y="357" width="335" height="335" rx="20"/>
      <rect x="568" y="402" width="105" height="105" rx="28" fill="#eee7f5"/>
      <g id="icon-foundation" class="lucide" transform="translate(584.5 418.5) scale(3)">
        <path d="M15 3h6v6"/>
        <path d="M9 21H3v-6"/>
        <path d="m21 3-7.5 7.5"/>
        <path d="m3 21 7.5-7.5"/>
      </g>
      <text class="trait" x="620.5" y="596" font-size="35" text-anchor="middle">Foundation</text>
      <text class="tagline" x="620.5" y="643" font-size="24" text-anchor="middle">Extend outwards</text>
    </g>

    <g id="card-amplification">
      <rect class="panel" x="811" y="357" width="335" height="335" rx="20"/>
      <rect x="926" y="402" width="105" height="105" rx="28" fill="#eee7f5"/>
      <g id="icon-amplification" class="lucide" transform="translate(942.5 418.5) scale(3)">
        <path d="m12 2 9 5-9 5-9-5 9-5Z"/>
        <path d="m3 12 9 5 9-5"/>
        <path d="m3 17 9 5 9-5"/>
      </g>
      <text class="trait" x="978.5" y="596" font-size="34" text-anchor="middle">Amplification</text>
      <text class="tagline" x="978.5" y="643" font-size="24" text-anchor="middle">Strengthen within</text>
    </g>

    <g id="card-exploration">
      <rect class="panel" x="1169" y="357" width="335" height="335" rx="20"/>
      <rect x="1284" y="402" width="105" height="105" rx="28" fill="#eee7f5"/>
      <g id="icon-exploration" class="lucide" transform="translate(1300.5 418.5) scale(3)">
        <circle cx="12" cy="12" r="10"/>
        <path d="m16.24 7.76-2.12 6.36-6.36 2.12 2.12-6.36z"/>
      </g>
      <text class="trait" x="1336.5" y="596" font-size="35" text-anchor="middle">Exploration</text>
      <text class="tagline" x="1336.5" y="643" font-size="24" text-anchor="middle">Discover nearby</text>
    </g>
  </g>

</svg>
